[project]
name = "devops-driver"
version = "0.1.0"
description = "Unified Windows Driver Analysis Platform — DriverScope + OVOIDA"
requires-python = ">=3.10"
dependencies = [
    "pefile>=2023.2.7",
    "capstone>=5.0.1",
]

[project.optional-dependencies]
dynamic = [
    "pywinrm>=0.4.3",          # WinRM for sandbox communication
    "requests>=2.28.0",        # CAPE API + HTTP
]
unpacking = [
    "frida>=16.0.0",           # Dynamic instrumentation
    "frida-tools>=12.0.0",     # Frida CLI helpers
    "lief>=0.14.0",            # PE/ELF manipulation (IAT rebuild)
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
devops-driver = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
